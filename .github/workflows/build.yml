# Builds and tests Pump and Plate on every push, on GitHub's own computers.
# Nothing here is signed or uploaded yet: this checks that the code compiles
# and the tests pass, for Android and for iPhone.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Write access only so a failed job can save its log to a ci-logs-* branch.
permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze (warnings shown, not fatal)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/logs/analyze.log"
      - name: Run the tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/logs/test.log"
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make the Android project
        run: flutter create . --platforms=android --org com.fitapp --project-name fitapp
      - name: Apply the app's Android settings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/logs" | Out-Null
          ../scripts/patch-android.ps1 -AppDir $PWD *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/logs/patch-android.log"
      - run: flutter pub get
      - name: Build the Android app
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/logs/build-android.log"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}

  ios:
    name: iPhone build
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: xcodebuild -version
      - name: Use CocoaPods for the iPhone packages
        run: flutter config --no-enable-swift-package-manager
      - name: Make the iOS project
        run: flutter create . --platforms=ios --org com.fitapp --project-name fitapp
      - run: flutter pub get
      - name: Apply the app's iPhone settings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          bash ../scripts/patch-ios.sh . 2>&1 | tee "$RUNNER_TEMP/logs/patch-ios.log"
      - name: Build for iPhone (unsigned)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/logs/build-ios.log"
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}
