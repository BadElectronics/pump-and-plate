# Builds and tests Pump and Plate on every push, on GitHub's own computers.
# Nothing here is signed or uploaded yet: this checks that the code compiles
# and the tests pass, for Android and for iPhone.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze (warnings shown, not fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make the Android project
        run: flutter create . --platforms=android --org com.fitapp --project-name fitapp
      - name: Apply the app's Android settings
        shell: pwsh
        run: ../scripts/patch-android.ps1 -AppDir $PWD
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    name: iPhone build
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: xcodebuild -version
      - name: Use CocoaPods for the iPhone packages
        run: flutter config --no-enable-swift-package-manager
      - name: Make the iOS project
        run: flutter create . --platforms=ios --org com.fitapp --project-name fitapp
      - run: flutter pub get
      - name: Apply the app's iPhone settings
        run: bash ../scripts/patch-ios.sh .
      - name: Build for iPhone (unsigned)
        run: flutter build ios --release --no-codesign
