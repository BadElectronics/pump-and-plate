# Builds and tests Pump and Plate on every push, on GitHub's own computers.
# Android: makes the Google Play file (.aab) and an APK for sideloading, signed
# with the upload key when the ANDROID_KEYSTORE_* secrets are set (made by
# make-upload-key.bat). Nothing is uploaded to the stores from here.
# iPhone: builds unsigned, to check it compiles.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Write access only so a failed job can save its log to a ci-logs-* branch.
permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze (warnings shown, not fatal)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/logs/analyze.log"
      - name: Run the tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/logs/test.log"
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make the Android project
        run: flutter create . --platforms=android --org com.fitapp --project-name fitapp
      - name: Apply the app's Android settings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/logs" | Out-Null
          ../scripts/patch-android.ps1 -AppDir $PWD *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/logs/patch-android.log"
      - run: flutter pub get
      - name: Add the upload key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No upload key in the repo's secrets, so this build is signed with a throwaway debug key. Google Play won't accept it."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=upload"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
          echo "Signing with the upload key."
      - name: Work out the version
        id: version
        shell: bash
        run: |
          # "Phase 5, build 16" in config.dart becomes version 1.5.16. The
          # build number only ever goes up, which Google Play requires.
          label=$(sed -nE "s/.*buildLabel = 'Phase ([0-9]+), build ([0-9]+)'.*/\1.\2/p" lib/src/config.dart)
          [ -n "$label" ] || { echo "Couldn't read buildLabel from config.dart"; exit 1; }
          echo "name=1.$label" >> "$GITHUB_OUTPUT"
          echo "number=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "Version 1.$label, build $((1000 + ${{ github.run_number }}))"
      - name: Build the Google Play file (.aab)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build appbundle --release \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.number }} \
            2>&1 | tee "$RUNNER_TEMP/logs/build-aab.log"
      - name: Build the APK for sideloading
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.number }} \
            2>&1 | tee "$RUNNER_TEMP/logs/build-apk.log"
      - name: Check the target Android version
        shell: bash
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt" dump badging build/app/outputs/flutter-apk/app-release.apk)
          echo "$badging" | grep -E "^package:|targetSdkVersion" | tee -a "$RUNNER_TEMP/logs/build-apk.log"
          target=$(echo "$badging" | sed -nE "s/^targetSdkVersion:'([0-9]+)'.*/\1/p")
          echo "::notice title=Android version::Targets API $target (Google Play needs 36 or newer). Flutter $(flutter --version | head -1)"
          [ "${target:-0}" -ge 36 ] || { echo "::error::Targets API $target; Google Play needs 36."; exit 1; }
      - name: Check for tracking libraries
        shell: bash
        run: |
          # The app promises no analytics or tracking. This lists every library
          # in the Android app and flags any that report to Google or others.
          (cd android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath) > "$RUNNER_TEMP/logs/dependencies.txt" 2>&1 || true
          pattern='com\.google\.mlkit|play-services-mlkit|com\.google\.firebase|datatransport|play-services-measurement|play-services-analytics|clearcut|crashlytics|sentry|appcenter|mixpanel|amplitude|facebook'
          hits=$(grep -oiE "[a-z0-9_.-]*($pattern)[a-z0-9_.:-]*" "$RUNNER_TEMP/logs/dependencies.txt" | sort -u | tr '\n' ' ')
          libs=$(grep -cE -- '--- ' "$RUNNER_TEMP/logs/dependencies.txt" || true)
          # Google Play Billing (the tip jar) brings in Google's reporting
          # library. That's expected: the app only starts Google Play Billing
          # when the tip jar is opened. Anything else is flagged.
          billing="" other=""
          for dep in $(echo "$hits" | tr ' ' '\n' | sed -nE 's/^([^:]+:[^:]+).*/\1/p' | sort -u); do
            chain=$(cd android && ./gradlew -q :app:dependencyInsight --dependency "$dep" --configuration releaseRuntimeClasspath 2>/dev/null \
              | grep -oE "(project :[A-Za-z0-9_]+|[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[0-9][A-Za-z0-9_.-]*)" | sort -u | tr '\n' ' ')
            if echo "$chain" | grep -q "com.android.billingclient:billing"; then
              billing="$billing $dep"
            else
              other="$other $dep"
              echo "::warning title=Brought in by ($dep)::$(echo "$chain" | cut -c1-900)"
            fi
          done
          if [ -n "$other" ]; then
            echo "::warning title=Tracking libraries::Found in the Android app:$other"
          else
            echo "::notice title=Tracking libraries::No ML Kit, Firebase or analytics libraries ($libs library entries checked).${billing:+ Google Play Billing brings its own reporting library (only started when the tip jar is opened):$billing}"
          fi
      - name: Remove the key from this computer
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: pump-and-plate-${{ steps.version.outputs.name }}-google-play
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pump-and-plate-${{ steps.version.outputs.name }}-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}

  ios:
    name: iPhone build
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: xcodebuild -version
      - name: Use CocoaPods for the iPhone packages
        run: flutter config --no-enable-swift-package-manager
      - name: Make the iOS project
        run: flutter create . --platforms=ios --org com.fitapp --project-name fitapp
      - run: flutter pub get
      - name: Apply the app's iPhone settings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          bash ../scripts/patch-ios.sh . 2>&1 | tee "$RUNNER_TEMP/logs/patch-ios.log"
      - name: Build for iPhone (unsigned)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee "$RUNNER_TEMP/logs/build-ios.log"
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}
