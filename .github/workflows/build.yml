# Builds and tests Pump and Plate on every push, on GitHub's own computers.
# Android: makes the Google Play file (.aab) and an APK for sideloading, signed
# with the upload key when the ANDROID_KEYSTORE_* secrets are set (made by
# make-upload-key.bat).
# iPhone: builds unsigned on ordinary pushes, to check it compiles. On a
# release or a manual run it signs the app and sends it to TestFlight, using
# the APP_STORE_CONNECT_* secrets. It signs with the stored certificate in
# the IOS_DIST_P12_BASE64 and IOS_DIST_P12_PASSWORD secrets, which App
# Review needs (it re-checks the signature at submission). To make that
# certificate: add the password secret, run this workflow by hand with
# "Make a new signing certificate" ticked, download the file it leaves, and
# put its text in IOS_DIST_P12_BASE64. Without those secrets a build signs
# with a throwaway certificate, good for TestFlight only.
#
# Releasing: put the version to ship in store/release.txt (say 1.5.20) and
# push. When it matches the version in app/lib/src/config.dart and no
# v1.5.20 tag exists yet, that push is a release: the Android build goes to
# Google Play Production, the iPhone build goes to TestFlight, and the build
# then tags the commit v1.5.20 so the same version is never shipped twice.
# Pushing a v* tag by hand works too.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      make_certificate:
        description: 'Make a new signing certificate (needs the IOS_DIST_P12_PASSWORD secret) instead of building'
        type: boolean
        default: false

# Pushes queue up instead of cancelling each other, so a release that is
# half-way through uploading is never cut off by the next push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Write access so a release can tag the commit and a failed job can save its
# log to a ci-logs-* branch.
permissions:
  contents: write

jobs:
  # One-off: makes the App Store signing certificate the iPhone builds use.
  # Leaves a file to download; its text goes in the IOS_DIST_P12_BASE64
  # secret. Delete the download from the run page afterwards.
  certificate:
    name: Make a signing certificate
    if: inputs.make_certificate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet --upgrade pyjwt cryptography
      - name: Make the certificate
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_PASSWORD" ]; then
            echo "::error::Add the IOS_DIST_P12_PASSWORD secret first (a long password of your choice)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cert"
          key_id=$(printf '%s' "$KEY_ID" | tr -d ' \r\n')
          printf '%s\n' "$KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
          APP_STORE_CONNECT_ISSUER_ID=$(printf '%s' "$ISSUER" | tr -d ' \r\n') \
          APP_STORE_CONNECT_KEY_ID="$key_id" APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
            python3 scripts/apple-signing.py make-certificate "$RUNNER_TEMP/cert" "$P12_PASSWORD"
          rm -f "$RUNNER_TEMP/cert/dist.p12" "$RUNNER_TEMP/AuthKey.p8"
          echo "::notice title=Next step::Download 'ios-signing-certificate' from this run, open dist.p12.base64.txt, and put its whole text in the IOS_DIST_P12_BASE64 secret. Then delete the download from this page."
      - uses: actions/upload-artifact@v4
        with:
          name: ios-signing-certificate
          path: ${{ runner.temp }}/cert/dist.p12.base64.txt
          retention-days: 1

  # Works out whether this push is a release (see the top of this file).
  release:
    name: Release check
    if: ${{ !inputs.make_certificate }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare store/release.txt with the app's version
        id: decide
        shell: bash
        run: |
          label=$(sed -nE "s/.*buildLabel = 'Phase ([0-9]+), build ([0-9]+)'.*/\1.\2/p" app/lib/src/config.dart)
          [ -n "$label" ] || { echo "Couldn't read buildLabel from config.dart"; exit 1; }
          version="1.$label"
          wanted=$(tr -d ' \r\n' < store/release.txt 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::Tag ${{ github.ref_name }} pushed by hand: releasing version $version."
          elif [[ "${{ github.event_name }}" != "push" || "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Not a push to main, so not a release."
          elif [ "$wanted" != "$version" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "store/release.txt says ${wanted:-nothing}; the app is $version. Check build only."
          elif git ls-remote --tags origin "refs/tags/v$version" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $version was already released (tag v$version exists). Check build only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::store/release.txt says $version and it hasn't shipped yet: this build goes to Google Play and TestFlight."
          fi

  test:
    name: Tests
    if: ${{ !inputs.make_certificate }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze (warnings shown, not fatal)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/logs/analyze.log"
      - name: Run the tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/logs/test.log"
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}

  android:
    name: Android build
    if: ${{ !inputs.make_certificate }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make the Android project
        run: flutter create . --platforms=android --org com.fitapp --project-name fitapp
      - name: Apply the app's Android settings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/logs" | Out-Null
          ../scripts/patch-android.ps1 -AppDir $PWD *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/logs/patch-android.log"
      - run: flutter pub get
      - name: Add the upload key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No upload key in the repo's secrets, so this build is signed with a throwaway debug key. Google Play won't accept it."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=upload"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
          echo "Signing with the upload key."
      - name: Work out the version
        id: version
        shell: bash
        run: |
          # "Phase 5, build 16" in config.dart becomes version 1.5.16. The
          # build number only ever goes up, which Google Play requires.
          label=$(sed -nE "s/.*buildLabel = 'Phase ([0-9]+), build ([0-9]+)'.*/\1.\2/p" lib/src/config.dart)
          [ -n "$label" ] || { echo "Couldn't read buildLabel from config.dart"; exit 1; }
          echo "name=1.$label" >> "$GITHUB_OUTPUT"
          echo "number=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "Version 1.$label, build $((1000 + ${{ github.run_number }}))"
      - name: Build the Google Play file (.aab)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build appbundle --release \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.number }} \
            2>&1 | tee "$RUNNER_TEMP/logs/build-aab.log"
      - name: Build the APK for sideloading
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.number }} \
            2>&1 | tee "$RUNNER_TEMP/logs/build-apk.log"
      - name: Check the target Android version
        shell: bash
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt" dump badging build/app/outputs/flutter-apk/app-release.apk)
          echo "$badging" | grep -E "^package:|targetSdkVersion" | tee -a "$RUNNER_TEMP/logs/build-apk.log"
          target=$(echo "$badging" | sed -nE "s/^targetSdkVersion:'([0-9]+)'.*/\1/p")
          echo "::notice title=Android version::Targets API $target (Google Play needs 36 or newer). Flutter $(flutter --version | head -1)"
          [ "${target:-0}" -ge 36 ] || { echo "::error::Targets API $target; Google Play needs 36."; exit 1; }
      - name: Check for tracking libraries
        shell: bash
        run: |
          # The app promises no analytics or tracking. This lists every library
          # in the Android app and flags any that report to Google or others.
          (cd android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath) > "$RUNNER_TEMP/logs/dependencies.txt" 2>&1 || true
          pattern='com\.google\.mlkit|play-services-mlkit|com\.google\.firebase|datatransport|play-services-measurement|play-services-analytics|clearcut|crashlytics|sentry|appcenter|mixpanel|amplitude|facebook'
          hits=$(grep -oiE "[a-z0-9_.-]*($pattern)[a-z0-9_.:-]*" "$RUNNER_TEMP/logs/dependencies.txt" | sort -u | tr '\n' ' ')
          libs=$(grep -cE -- '--- ' "$RUNNER_TEMP/logs/dependencies.txt" || true)
          # Google Play Billing (the tip jar) brings in Google's reporting
          # library. That's expected: the app only starts Google Play Billing
          # when the tip jar is opened. Anything else is flagged.
          billing="" other=""
          for dep in $(echo "$hits" | tr ' ' '\n' | sed -nE 's/^([^:]+:[^:]+).*/\1/p' | sort -u); do
            chain=$(cd android && ./gradlew -q :app:dependencyInsight --dependency "$dep" --configuration releaseRuntimeClasspath 2>/dev/null \
              | grep -oE "(project :[A-Za-z0-9_]+|[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[0-9][A-Za-z0-9_.-]*)" | sort -u | tr '\n' ' ')
            if echo "$chain" | grep -q "com.android.billingclient:billing"; then
              billing="$billing $dep"
            else
              other="$other $dep"
              echo "::warning title=Brought in by ($dep)::$(echo "$chain" | cut -c1-900)"
            fi
          done
          if [ -n "$other" ]; then
            echo "::warning title=Tracking libraries::Found in the Android app:$other"
          else
            echo "::notice title=Tracking libraries::No ML Kit, Firebase or analytics libraries ($libs library entries checked).${billing:+ Google Play Billing brings its own reporting library (only started when the tip jar is opened):$billing}"
          fi
      - name: Remove the key from this computer
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: pump-and-plate-${{ steps.version.outputs.name }}-google-play
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pump-and-plate-${{ steps.version.outputs.name }}-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}

  ios:
    name: iPhone build
    needs: [release]
    if: ${{ !inputs.make_certificate }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: xcodebuild -version
      - name: Use CocoaPods for the iPhone packages
        run: flutter config --no-enable-swift-package-manager
      - name: Make the iOS project
        run: flutter create . --platforms=ios --org com.fitapp --project-name fitapp
      - run: flutter pub get
      - name: Apply the app's iPhone settings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          bash ../scripts/patch-ios.sh . 2>&1 | tee "$RUNNER_TEMP/logs/patch-ios.log"
      - name: Work out the version
        id: version
        shell: bash
        run: |
          # Same version and build number scheme as the Android build.
          label=$(sed -nE "s/.*buildLabel = 'Phase ([0-9]+), build ([0-9]+)'.*/\1.\2/p" lib/src/config.dart)
          [ -n "$label" ] || { echo "Couldn't read buildLabel from config.dart"; exit 1; }
          echo "name=1.$label" >> "$GITHUB_OUTPUT"
          echo "number=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "Version 1.$label, build $((1000 + ${{ github.run_number }}))"
      - name: Decide whether to send it to TestFlight
        id: mode
        shell: bash
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [[ "${{ needs.release.outputs.release }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [ -z "$ISSUER" ] || [ -z "$KEY_ID" ] || [ -z "$KEY_P8" ]; then
              echo "::error::Add the APP_STORE_CONNECT_ISSUER_ID, _KEY_ID and _KEY_P8 secrets to send builds to TestFlight."
              exit 1
            fi
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "This build will be signed and sent to TestFlight."
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "Unsigned check build only."
          fi
      - name: Build for iPhone
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          flutter build ios --release --no-codesign \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.number }} \
            -v 2>&1 | tee "$RUNNER_TEMP/logs/build-ios.log"
      - name: Get the signing certificate and a profile for this build
        id: asc
        if: steps.mode.outputs.upload == 'true'
        shell: bash
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          key_id=$(printf '%s' "$KEY_ID" | tr -d ' \r\n')
          issuer=$(printf '%s' "$ISSUER" | tr -d ' \r\n')
          mkdir -p "$RUNNER_TEMP/asc"
          key_path="$RUNNER_TEMP/asc/AuthKey_$key_id.p8"
          printf '%s\n' "$KEY_P8" | tr -d '\r' > "$key_path"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          export APP_STORE_CONNECT_ISSUER_ID="$issuer" APP_STORE_CONNECT_KEY_ID="$key_id" APP_STORE_CONNECT_KEY_PATH="$key_path"
          if [ -n "$DIST_P12_BASE64" ] && [ -n "$DIST_P12_PASSWORD" ]; then
            # The stored certificate: the same one on every build, never revoked.
            p12_pw="$DIST_P12_PASSWORD"
            printf '%s' "$DIST_P12_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/asc/stored.p12"
            "$RUNNER_TEMP/venv/bin/python" ../scripts/apple-signing.py setup com.pumpandplate.app "$RUNNER_TEMP/asc" "$p12_pw" "$RUNNER_TEMP/asc/stored.p12" > "$RUNNER_TEMP/asc/out.txt"
            echo "Signing with the stored certificate."
          else
            p12_pw=$(uuidgen)
            "$RUNNER_TEMP/venv/bin/python" ../scripts/apple-signing.py setup com.pumpandplate.app "$RUNNER_TEMP/asc" "$p12_pw" > "$RUNNER_TEMP/asc/out.txt"
            echo "::warning title=Throwaway certificate::No IOS_DIST_P12_BASE64 and IOS_DIST_P12_PASSWORD secrets, so this build is signed with a certificate that is revoked afterwards. Fine for TestFlight; App Review rejects it (ITMS-90035). See the top of build.yml."
          fi
          cat "$RUNNER_TEMP/asc/out.txt" >> "$GITHUB_OUTPUT"
          {
            echo "key_path=$key_path"
            echo "key_id=$key_id"
            echo "issuer=$issuer"
          } >> "$GITHUB_OUTPUT"
          # A throwaway keychain holding only this build's certificate.
          kc="$RUNNER_TEMP/asc/signing.keychain-db"
          kc_pw=$(uuidgen)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          curl -fsSL -o "$RUNNER_TEMP/asc/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/asc/wwdr.cer" -k "$kc" -A || true
          security import "$RUNNER_TEMP/asc/dist.p12" -k "$kc" -P "$p12_pw" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          echo "keychain=$kc" >> "$GITHUB_OUTPUT"
          # Install the profile where Xcode looks for it.
          uuid=$(grep '^profile_uuid=' "$RUNNER_TEMP/asc/out.txt" | cut -d= -f2)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/asc/profile.mobileprovision" "$d/$uuid.mobileprovision"
          done
          team=$(grep '^team=' "$RUNNER_TEMP/asc/out.txt" | cut -d= -f2)
          name=$(grep '^profile_name=' "$RUNNER_TEMP/asc/out.txt" | cut -d= -f2-)
          python3 ../scripts/ios-manual-signing.py ios/Runner.xcodeproj/project.pbxproj com.pumpandplate.app "$team" "$name"
          echo "Signing for team $team with profile \"$name\"."
      - name: Sign the app
        if: steps.mode.outputs.upload == 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.asc.outputs.keychain }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/logs/archive-ios.log"
      - name: Send it to TestFlight
        if: steps.mode.outputs.upload == 'true'
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ steps.asc.outputs.team }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pumpandplate.app</key><string>${{ steps.asc.outputs.profile_name }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "${{ steps.asc.outputs.key_id }}" \
            -authenticationKeyIssuerID "${{ steps.asc.outputs.issuer }}" \
            2>&1 | tee "$RUNNER_TEMP/logs/upload-ios.log"
          echo "Uploaded version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.number }}). Apple processes it for TestFlight in about 5 to 30 minutes."
      - name: Remove this build's profile and key (and a throwaway certificate)
        if: always() && steps.mode.outputs.upload == 'true'
        shell: bash
        run: |
          if [ -n "${{ steps.asc.outputs.cert_id }}" ]; then
            keep=""
            [ "${{ steps.asc.outputs.cert_stored }}" = "true" ] && keep="keep-certificate"
            APP_STORE_CONNECT_ISSUER_ID="${{ steps.asc.outputs.issuer }}" \
            APP_STORE_CONNECT_KEY_ID="${{ steps.asc.outputs.key_id }}" \
            APP_STORE_CONNECT_KEY_PATH="${{ steps.asc.outputs.key_path }}" \
              "$RUNNER_TEMP/venv/bin/python" ../scripts/apple-signing.py cleanup \
              "${{ steps.asc.outputs.cert_id }}" "${{ steps.asc.outputs.profile_id }}" $keep || true
          fi
          [ -n "${{ steps.asc.outputs.keychain }}" ] && security delete-keychain "${{ steps.asc.outputs.keychain }}" || true
          rm -rf "$RUNNER_TEMP/asc"
      - name: Save the log of a failed build
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -qm "Logs from run ${{ github.run_id }}, ${{ github.job }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.job }}

  # Checks the Google Play upload robot can reach the app. Read-only: it
  # opens a draft and throws it away, so nothing on Google Play changes.
  play-access:
    name: Google Play access check
    if: github.ref == 'refs/heads/main' && !inputs.make_certificate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-auth requests
      - name: Check the upload robot
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/check-play-access.py

  # Sends the signed Google Play file to the Production track, only on a
  # release (see the top of this file). Needs the PLAY_SERVICE_ACCOUNT_JSON
  # secret: a Google Cloud service account invited in Play Console with
  # permission to release. Google still reviews each update before it
  # reaches people.
  publish:
    name: Publish to Google Play
    needs: [release, test, android]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pump-and-plate-*-google-play
          path: dist
          merge-multiple: true
      - name: Check the Google Play key is set
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Add the PLAY_SERVICE_ACCOUNT_JSON secret to publish automatically."
            exit 1
          fi
          ls -la dist
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pumpandplate.app
          releaseFiles: dist/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: store/whatsnew
      - name: Tag the released commit
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        run: |
          v="v${{ needs.release.outputs.version }}"
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git tag -a "$v" -m "Pump and Plate ${{ needs.release.outputs.version }}"
          git push origin "$v"
          echo "::notice title=Released::Version ${{ needs.release.outputs.version }} sent to Google Play and tagged $v."
