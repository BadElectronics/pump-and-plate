name: fitapp
description: Private, local-first fitness and nutrition tracker.
publish_to: 'none'

# The build scripts set the real version on every build (1.<phase>.<build>).
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  flutter_local_notifications: ^22.3.1
  timezone: any
  file_picker: ^13.1.0
  camera: ^0.12.1
  # Reads barcodes on the phone (ZXing). Nothing is sent anywhere, unlike
  # Google's ML Kit, which reports usage to Google.
  flutter_zxing: ^3.1.0
  flutter_gemma: ^1.11.0
  flutter_gemma_litertlm: ^1.8.4
  path_provider: ^2.1.0
  local_auth: ^3.0.0
  home_widget: ^0.9.4
  crypto: ^3.0.6
  in_app_purchase: ^3.2.0
  # The app's own iPhone code (device features, backup folder, Apple's AI).
  pump_native:
    path: packages/pump_native

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/bodyfat/
    - assets/foods/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
