name: pump_native
description: Pump and Plate's own iPhone code - device features, the backup folder and Apple's on-device AI.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PumpNativePlugin
